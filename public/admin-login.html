<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Sadhana Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(80,120,180,0.28),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #101820,
          #26384d,
          #173b73
        );

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 12px;

      border-radius: 18px;

      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
    }

    .brand h1 {
      margin: 0;
      font-size: 25px;
    }

    .brand p {
      margin: 6px 0 0;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }

    .box {
      background: white;
      padding: 35px;

      border-radius: 20px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
    }

    .box h2 {
      text-align: center;

      margin: 0 0 8px;

      color: #172033;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;

      color: #748093;

      margin: 0 0 28px;

      font-size: 14px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid #d9e0ea;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

      transition: 0.2s;

      background: #fafbfc;
    }

    input:focus {
      border-color: #173b73;

      background: white;

      box-shadow:
        0 0 0 3px rgba(23,59,115,0.1);
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 5px;

      background:
        linear-gradient(
          135deg,
          #26384d,
          #173b73
        );

      color: white;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 18px rgba(23,59,115,0.25);
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 24px 0 18px;

      color: #9aa4b2;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background: #e5e9ef;

      flex: 1;
    }

    .back {
      display: block;

      text-align: center;

      color: #173b73;

      text-decoration: none;

      font-size: 14px;

      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }

    .security {
      text-align: center;

      margin-top: 22px;

      color: #8a94a3;

      font-size: 12px;
    }

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .box {
        padding: 27px 20px;

        border-radius: 17px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .brand-icon {
        width: 58px;
        height: 58px;

        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <div class="brand">

      <div class="brand-icon">
        🔐
      </div>

      <h1>Sadhana Library</h1>

      <p>
        Study • Focus • Success
      </p>

    </div>


    <div class="box">

      <h2>🔐 Admin Login</h2>

      <p class="subtitle">
        Library Management Panel
      </p>


      <form
        action="/admin-login"
        method="POST"
      >

        <div class="field">

          <label for="username">
            👤 Admin Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            placeholder="Admin username डालें"
            autocomplete="username"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            🔒 Admin Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            placeholder="Admin password डालें"
            autocomplete="current-password"
            required
          >

        </div>


        <button type="submit">
          Login to Admin Panel →
        </button>

      </form>


      <div class="divider">
        Sadhana Library Management
      </div>


      <a
        class="back"
        href="/"
      >
        ← Back to Home
      </a>


      <div class="security">
        🔒 Secure Admin Access
      </div>

    </div>

  </div>

</body>
</html>
