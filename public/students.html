<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Students - Sadhana Library</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      background: linear-gradient(135deg, #173b73, #2563eb);
      color: white;
      padding: 22px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    .header-left h1 {
      margin: 0;
      font-size: 27px;
    }

    .header-left p {
      margin: 6px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .back-btn {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 11px 17px;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* =========================
       MAIN
    ========================== */

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* =========================
       ADD STUDENT CARD
    ========================== */

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
      border: 1px solid #e8edf5;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaf1ff;
      border-radius: 10px;
      font-size: 20px;
    }

    /* =========================
       FORM
    ========================== */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: bold;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d7deea;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
      background: #fbfcfe;
    }

    input:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-bottom {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .add-btn {
      border: none;
      background: linear-gradient(135deg, #173b73, #2563eb);
      color: white;
      padding: 13px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
    }

    .add-btn:hover {
      transform: translateY(-1px);
    }

    #message {
      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       STUDENT LIST
    ========================== */

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
    }

    .student-count {
      background: #eef4ff;
      color: #173b73;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    th {
      background: #173b73;
      color: white;
      padding: 14px 12px;
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #edf1f5;
      text-align: center;
      font-size: 14px;
      background: white;
    }

    tbody tr:hover td {
      background: #f8faff;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* =========================
       STATUS
    ========================== */

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-paid {
      background: #dcfce7;
      color: #166534;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .attendance {
      font-weight: bold;
      color: #173b73;
    }

    /* =========================
       DELETE
    ========================== */

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #dc2626;
      color: white;
    }

    /* =========================
       EMPTY / LOADING
    ========================== */

    .empty {
      padding: 35px !important;
      color: #64748b;
      font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 850px) {

      .header {
        padding: 20px;
      }

      .header-left h1 {
        font-size: 22px;
      }

      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .back-btn {
        width: 100%;
        text-align: center;
      }

      .container {
        margin: 20px auto;
        padding: 0 12px;
      }

      .card {
        padding: 18px;
        border-radius: 15px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-bottom {
        flex-direction: column;
        align-items: stretch;
      }

      .add-btn {
        width: 100%;
      }

      #message {
        text-align: center;
      }

      .list-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div class="header-left">
      <h1>👨‍🎓 Student Management</h1>
      <p>Sadhana Library • Student Records</p>
    </div>

    <a
      href="/admin-dashboard.html"
      class="back-btn">
      ← Back to Dashboard
    </a>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="container">


    <!-- =========================
         ADD STUDENT
    ========================== -->

    <section class="card">

      <div class="card-title">

        <div class="icon-box">
          ➕
        </div>

        <h2>Add New Student</h2>

      </div>


      <form id="studentForm">

        <div class="form-grid">

          <div class="input-group">

            <label for="name">
              Student Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter student name"
              required
            >

          </div>


          <div class="input-group">

            <label for="mobile">
              Mobile Number
            </label>

            <input
              type="tel"
              id="mobile"
              placeholder="Enter mobile number"
              required
            >

          </div>


          <div class="input-group">

            <label for="password">
              Student Password
            </label>

            <input
              type="password"
              id="password"
              placeholder="Create password"
              required
            >

          </div>


          <div class="input-group">

            <label for="seat_number">
              Seat Number
            </label>

            <input
              type="text"
              id="seat_number"
              placeholder="e.g. A-01"
            >

          </div>

        </div>


        <div class="form-bottom">

          <button
            type="submit"
            class="add-btn">
            ➕ Add Student
          </button>

          <div id="message"></div>

        </div>

      </form>

    </section>


    <!-- =========================
         STUDENT LIST
    ========================== -->

    <section class="card">

      <div class="list-header">

        <div class="card-title" style="margin-bottom:0;">

          <div class="icon-box">
            📋
          </div>

          <h2>Student List</h2>

        </div>

        <div
          id="studentCount"
          class="student-count">
          0 Students
        </div>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Mobile</th>
              <th>Seat</th>
              <th>Fee Status</th>
              <th>Attendance</th>
              <th>Action</th>
            </tr>

          </thead>


          <tbody id="studentList">

            <tr>

              <td
                colspan="7"
                class="empty">
                ⏳ Students loading...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <script>

    // =========================
    // LOAD STUDENTS
    // =========================

    async function loadStudents() {

      try {

        const response = await fetch(
          "/api/students",
          {
            cache: "no-store"
          }
        );


        if (response.status === 401) {

          window.location.href =
            "/admin-login.html";

          return;
        }


        if (!response.ok) {

          throw new Error(
            "Students load नहीं हुए।"
          );

        }


        const students =
          await response.json();


        document.getElementById(
          "studentCount"
        ).textContent =
          `${students.length} Students`;


        const list =
          document.getElementById(
            "studentList"
          );


        if (students.length === 0) {

          list.innerHTML = `

            <tr>

              <td
                colspan="7"
                class="empty">

                👨‍🎓 अभी कोई student नहीं है।

              </td>

            </tr>

          `;

          return;
        }


        list.innerHTML =
          students.map(student => {

            const feeStatus =
              student.fee_status || "Pending";


            let statusClass =
              "status-pending";


            if (
              feeStatus.toLowerCase()
                === "paid"
            ) {

              statusClass =
                "status-paid";

            }
            else if (
              feeStatus.toLowerCase()
                === "rejected"
            ) {

              statusClass =
                "status-rejected";

            }


            return `

              <tr>

                <td>
                  <strong>
                    #${student.id}
                  </strong>
                </td>


                <td>
                  <strong>
                    ${escapeHtml(student.name)}
                  </strong>
                </td>


                <td>
                  ${escapeHtml(student.mobile)}
                </td>


                <td>
                  ${escapeHtml(
                    student.seat_number || "—"
                  )}
                </td>


                <td>

                  <span
                    class="status ${statusClass}">

                    ${escapeHtml(feeStatus)}

                  </span>

                </td>


                <td>

                  <span class="attendance">
                    ${student.attendance || 0}%
                  </span>

                </td>


                <td>

                  <button
                    class="delete-btn"
                    onclick="deleteStudent(${student.id})">

                    🗑 Delete

                  </button>

                </td>

              </tr>

            `;

          }).join("");


      } catch (error) {

        console.error(error);


        document.getElementById(
          "studentList"
        ).innerHTML = `

          <tr>

            <td
              colspan="7"
              class="empty">

              ❌ Students load नहीं हो सके।

            </td>

          </tr>

        `;

      }

    }


    // =========================
    // ADD STUDENT
    // =========================

    document
      .getElementById("studentForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const name =
            document.getElementById(
              "name"
            ).value.trim();


          const mobile =
            document.getElementById(
              "mobile"
            ).value.trim();


          const password =
            document.getElementById(
              "password"
            ).value;


          const seat_number =
            document.getElementById(
              "seat_number"
            ).value.trim();


          const message =
            document.getElementById(
              "message"
            );


          message.textContent =
            "Student add हो रहा है...";

          message.style.color =
            "#2563eb";


          try {

            const response =
              await fetch(
                "/api/students",
                {

                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    name,
                    mobile,
                    password,
                    seat_number
                  })

                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              message.style.color =
                "#dc2626";

              message.textContent =
                data.error ||
                "Student add नहीं हुआ।";

              return;
            }


            message.style.color =
              "#198754";

            message.textContent =
              "✓ Student successfully add हो गया।";


            document
              .getElementById(
                "studentForm"
              )
              .reset();


            loadStudents();


          } catch (error) {

            console.error(error);


            message.style.color =
              "#dc2626";

            message.textContent =
              "Server से connection नहीं हो पाया।";

          }

        }
      );


    // =========================
    // DELETE STUDENT
    // =========================

    async function deleteStudent(id) {

      const confirmDelete =
        confirm(
          "क्या आप इस student को delete करना चाहते हैं?"
        );


      if (!confirmDelete) {
        return;
      }


      try {

        const response =
          await fetch(
            `/api/students/${id}`,
            {
              method: "DELETE"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.error ||
            "Student delete नहीं हुआ।"
          );

          return;
        }


        alert(
          data.message ||
          "Student delete हो गया।"
        );


        loadStudents();


      } catch (error) {

        console.error(error);


        alert(
          "Server से connection नहीं हो पाया।"
        );

      }

    }


    // =========================
    // HTML SECURITY
    // =========================

    function escapeHtml(value) {

      const div =
        document.createElement("div");


      div.textContent =
        value ?? "";


      return div.innerHTML;

    }


    // =========================
    // START
    // =========================

    loadStudents();

  </script>

</body>
</html>
